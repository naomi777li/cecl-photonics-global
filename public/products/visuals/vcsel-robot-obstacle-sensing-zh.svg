<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="620" viewBox="0 0 1280 620" role="img" aria-labelledby="title desc">
  <title id="title">VCSEL 三角测距避障感知路径</title>
  <desc id="desc">展示 VCSEL 发射器、投射线光、反射回波、图像接收器、标定距离估算与机器人运动控制的技术框图。</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#eff8fa"/><stop offset="1" stop-color="#fff"/></linearGradient>
    <linearGradient id="beam" x1="0" x2="1"><stop stop-color="#1da7c0" stop-opacity=".08"/><stop offset="1" stop-color="#1da7c0" stop-opacity=".55"/></linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#168ca1"/></marker>
    <marker id="arrow-dark" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 10 5 0 10z" fill="#345360"/></marker>
  </defs>
  <rect width="1280" height="620" rx="28" fill="url(#bg)"/>
  <text x="54" y="64" fill="#16333d" font-family="Arial,'Noto Sans SC',sans-serif" font-size="25" font-weight="700" letter-spacing="2">基于三角测距的避障感知</text>
  <text x="54" y="98" fill="#607984" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17">发射器只是经过标定的光学与控制系统中的一个器件</text>
  <rect x="48" y="142" width="212" height="330" rx="18" fill="#fff" stroke="#c5dce2" stroke-width="2"/>
  <circle cx="154" cy="254" r="48" fill="#e8f7f9" stroke="#168ca1" stroke-width="3"/>
  <circle cx="154" cy="254" r="17" fill="#c13855"/>
  <path d="M203 254h38" stroke="#168ca1" stroke-width="5" marker-end="url(#arrow)"/>
  <text x="154" y="347" text-anchor="middle" fill="#183640" font-family="Arial,'Noto Sans SC',sans-serif" font-size="21" font-weight="700">VCSEL 发射器</text>
  <text x="154" y="378" text-anchor="middle" fill="#607984" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16">808 nm 或 850 nm</text>
  <text x="154" y="410" text-anchor="middle" fill="#607984" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15">驱动 · 热路径</text>
  <path d="M260 232 680 186 680 318Z" fill="url(#beam)"/>
  <path d="M260 249 684 240" stroke="#168ca1" stroke-width="4" stroke-dasharray="13 10" marker-end="url(#arrow)"/>
  <path d="M260 262 684 266" stroke="#168ca1" stroke-width="4" stroke-dasharray="13 10" marker-end="url(#arrow)"/>
  <text x="442" y="197" text-anchor="middle" fill="#167d90" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="700">投射线光图案</text>
  <path d="M722 170 722 383" stroke="#345360" stroke-width="10" stroke-linecap="round"/>
  <path d="M710 219h24M710 277h24M710 335h24" stroke="#fff" stroke-width="4"/>
  <text x="722" y="426" text-anchor="middle" fill="#183640" font-family="Arial,'Noto Sans SC',sans-serif" font-size="20" font-weight="700">障碍物表面</text>
  <text x="722" y="452" text-anchor="middle" fill="#607984" font-family="Arial,'Noto Sans SC',sans-serif" font-size="15">回波位置随几何关系变化</text>
  <path d="M712 248 886 188" stroke="#c13855" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-dark)"/>
  <path d="M712 290 886 256" stroke="#c13855" stroke-width="3" stroke-dasharray="8 7" marker-end="url(#arrow-dark)"/>
  <rect x="888" y="145" width="151" height="188" rx="17" fill="#fff" stroke="#c5dce2" stroke-width="2"/>
  <rect x="921" y="182" width="84" height="54" rx="8" fill="#eaf4f6" stroke="#345360" stroke-width="3"/>
  <path d="M934 220l17-22 13 15 13-11 17 18" fill="none" stroke="#168ca1" stroke-width="4"/>
  <circle cx="963" cy="208" r="4" fill="#c13855"/>
  <text x="964" y="276" text-anchor="middle" fill="#183640" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700">图像接收端</text>
  <text x="964" y="302" text-anchor="middle" fill="#607984" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14">光学 · 滤光 · 对准</text>
  <path d="M1040 239h39" stroke="#168ca1" stroke-width="4" marker-end="url(#arrow)"/>
  <rect x="1082" y="145" width="150" height="188" rx="17" fill="#183640"/>
  <path d="M1111 198h90M1111 218h63M1111 238h80" stroke="#7fd3df" stroke-width="5" stroke-linecap="round"/>
  <text x="1157" y="277" text-anchor="middle" fill="#fff" font-family="Arial,'Noto Sans SC',sans-serif" font-size="18" font-weight="700">标定并决策</text>
  <text x="1157" y="302" text-anchor="middle" fill="#c9dce1" font-family="Arial,'Noto Sans SC',sans-serif" font-size="14">距离 · 运动控制</text>
  <rect x="48" y="510" width="1184" height="70" rx="14" fill="#e5f3f5"/>
  <text x="75" y="541" fill="#183640" font-family="Arial,'Noto Sans SC',sans-serif" font-size="17" font-weight="700">系统输入</text>
  <text x="250" y="541" fill="#48636e" font-family="Arial,'Noto Sans SC',sans-serif" font-size="16">目标反射率 · 接收视场 · 线光光学 · 环境光 · 标定 · 决策阈值</text>
  <text x="75" y="565" fill="#6b838d" font-family="Arial,'Noto Sans SC',sans-serif" font-size="13">工程讨论框图。模块及机器人表现取决于完整设计与验证。</text>
</svg>
